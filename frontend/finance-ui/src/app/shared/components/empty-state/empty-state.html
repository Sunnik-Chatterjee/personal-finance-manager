<div class="empty-state-wrapper">
  <div class="floating-orb-container">
    <div class="floating-orb">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/>
        <line x1="12" x2="12" y1="6" y2="8"/>
        <line x1="12" x2="12" y1="16" y2="18"/>
      </svg>
    </div>
    <div class="orb-aura"></div>
  </div>

  <h4 class="empty-title">{{ title() }}</h4>
  <p class="empty-description">{{ description() }}</p>

  @if (actionLabel()) {
    <button type="button" class="btn-primary empty-cta-btn" (click)="actionClicked.emit()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" x2="12" y1="5" y2="19"/>
        <line x1="5" x2="19" y1="12" y2="12"/>
      </svg>
      <span>{{ actionLabel() }}</span>
    </button>
  }
</div>
