<app-modal [isOpen]="isOpen()" [title]="isEditMode() ? 'Edit Transaction' : 'Add Transaction'" (closed)="onClose()">
  <form class="transaction-form" (submit)="onSubmit($event)">
    <!-- Type Selector -->
    <div class="form-group">
      <label class="form-label">Transaction Type</label>
      <div class="type-segmented-control">
        <button
          type="button"
          class="type-pill-btn income"
          [class.selected]="type() === 'INCOME'"
          (click)="setType('INCOME')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" x2="12" y1="19" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
          <span>Income</span>
        </button>
        <button
          type="button"
          class="type-pill-btn expense"
          [class.selected]="type() === 'EXPENSE'"
          (click)="setType('EXPENSE')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" x2="12" y1="5" y2="19"/>
            <polyline points="19 12 12 19 5 12"/>
          </svg>
          <span>Expense</span>
        </button>
      </div>
    </div>

    <!-- Amount -->
    <div class="form-group">
      <label for="amountInput" class="form-label">Amount (₹)</label>
      <div class="input-with-icon">
        <span class="currency-prefix">₹</span>
        <input
          id="amountInput"
          type="number"
          step="0.01"
          min="0.01"
          required
          class="glass-input tabular-nums amount-input"
          placeholder="0.00"
          [value]="amount()"
          (input)="onAmountChange($event)"
        />
      </div>
    </div>

    <!-- Category -->
    <div class="form-group">
      <label for="categorySelect" class="form-label">Category</label>
      <select
        id="categorySelect"
        required
        class="glass-input glass-select"
        [value]="category()"
        (change)="onCategoryChange($event)">
        @for (cat of availableCategories(); track cat) {
          <option [value]="cat">{{ cat }}</option>
        }
      </select>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label for="descriptionInput" class="form-label">Description (Optional)</label>
      <input
        id="descriptionInput"
        type="text"
        class="glass-input"
        placeholder="e.g. Grocery shopping, Client payment..."
        [value]="description()"
        (input)="onDescriptionChange($event)"
      />
    </div>

    <!-- Date -->
    <div class="form-group">
      <label for="dateInput" class="form-label">Date</label>
      <input
        id="dateInput"
        type="date"
        required
        class="glass-input"
        [value]="date()"
        (input)="onDateChange($event)"
      />
    </div>

    @if (errorMessage()) {
      <div class="form-error-banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" x2="12" y1="8" y2="12"/>
          <line x1="12" x2="12.01" y1="16" y2="16"/>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Footer Actions -->
    <div footer class="modal-actions">
      <button type="button" class="btn-secondary" (click)="onClose()">
        Cancel
      </button>
      <button type="submit" class="btn-primary" [disabled]="submitting()">
        @if (submitting()) {
          <span>Saving...</span>
        } @else {
          <span>{{ isEditMode() ? 'Update Transaction' : 'Save Transaction' }}</span>
        }
      </button>
    </div>
  </form>
</app-modal>
